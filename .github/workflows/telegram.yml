# Уведомления в Телеграм-канал об изменениях инструкций для агентов.
# Нужны секреты репозитория: TELEGRAM_TOKEN и TELEGRAM_CHAT_ID
# (Settings → Secrets and variables → Actions).
name: Notify Telegram

on:
  push:
    branches: [main]
    paths: ['**.md']

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Send message
        env:
          TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
          MESSAGE: ${{ github.event.head_commit.message }}
          COMPARE: ${{ github.event.compare }}
        run: |
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            FILES=$(git ls-files '*.md')
          else
            FILES=$(git diff --name-only "$BEFORE" "$AFTER" -- '*.md')
          fi
          FILES_LIST=$(echo "$FILES" | sed 's/^/• /')
          TEXT=$(printf '✏️ %s обновил инструкции\n\n%s\n\nФайлы:\n%s\n\nЧто изменилось: %s' \
            "$AUTHOR" "$MESSAGE" "$FILES_LIST" "$COMPARE")
          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            --data-urlencode "chat_id=$CHAT_ID" \
            --data-urlencode "text=$TEXT" \
            -d "disable_web_page_preview=true"
